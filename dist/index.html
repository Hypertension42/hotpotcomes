<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="一人一勺：最后一勺。前面四勺已经下锅，现在只差你这一勺。">
  <title>一人一勺：最后一勺</title>
  <style>
    :root {
      --bg: #1a0907;
      --cream: #fff0d2;
      --gold: #ffd05a;
      --red: #ff5a37;
      --brown: #74351f;
      --dark: #210c08;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      color: var(--cream);
      background: var(--bg);
      font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
      touch-action: none;
      user-select: none;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background:
        linear-gradient(rgba(255,255,255,.035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.026) 1px, transparent 1px),
        radial-gradient(circle at 50% 38%, rgba(255, 88, 49, .24), transparent 34%),
        radial-gradient(circle at 50% 92%, rgba(255, 208, 90, .16), transparent 28%),
        linear-gradient(160deg, #34120d 0%, #210b08 55%, #120504 100%);
      background-size: 8px 8px, 8px 8px, 100% 100%, 100% 100%, 100% 100%;
      image-rendering: pixelated;
    }

    #app {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      overflow: hidden;
    }

    canvas {
      display: block;
      width: min(100vw, 460px);
      height: 100svh;
      max-height: 920px;
      image-rendering: pixelated;
    }

    .fallback {
      position: fixed;
      inset: 0;
      z-index: 20;
      display: none;
      place-items: center;
      padding: 24px;
      color: var(--cream);
      background: #1a0907;
      text-align: center;
      font-weight: 900;
    }

    .actions {
      position: fixed;
      left: 50%;
      bottom: max(14px, env(safe-area-inset-bottom));
      z-index: 10;
      display: none;
      width: min(calc(100vw - 28px), 420px);
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      transform: translateX(-50%);
    }

    .actions.show {
      display: grid;
    }

    button {
      min-height: 50px;
      border: 0;
      border-radius: 8px;
      padding: 12px 14px;
      color: #2b100b;
      background: var(--gold);
      box-shadow: 0 6px 0 rgba(0, 0, 0, .28);
      font: inherit;
      font-weight: 900;
    }

    button.secondary {
      color: var(--cream);
      background: rgba(255, 240, 210, .12);
      border: 2px solid rgba(255, 240, 210, .24);
      box-shadow: none;
    }
  </style>
</head>
<body>
  <main id="app">
    <canvas id="game" aria-label="一人一勺最后一勺互动作品"></canvas>
  </main>
  <div id="fallback" class="fallback" role="alert">锅坏了，再涮一次吧~</div>
  <div id="actions" class="actions">
    <button id="shareBtn" type="button">复制这份锅报</button>
    <button id="againBtn" class="secondary" type="button">再下一勺</button>
  </div>

  <script>
    (function () {
      "use strict";

      try {
        const canvas = document.getElementById("game");
        const ctx = canvas.getContext("2d", { alpha: false });
        const fallback = document.getElementById("fallback");
        const actions = document.getElementById("actions");
        const shareBtn = document.getElementById("shareBtn");
        const againBtn = document.getElementById("againBtn");
        const STORE_KEY = "one_spoon_last_spoon_stats";
        const DPR_LIMIT = 2;
        const TARGET = 5;

        const PRESETS = [
          {
            target: "让这锅活过 5 勺",
            before: 42,
            records: [
              { name: "清汤", open: "第1勺：清汤把锅救回一点。", fog: "第1勺：有人说自己在救锅", delta: 18, heat: -6, color: "#8fd3c2" },
              { name: "辣油", open: "第2勺：辣油让锅开始冒红泡。", fog: "第2勺：红色汤花，看不清", delta: -28, heat: 22, color: "#ff6848" },
              { name: "雪梨汤", open: "第3勺：雪梨汤压住了一半火气。", fog: "第3勺：留下了一句“别急”", delta: 14, heat: -10, color: "#ffd9a1" },
              { name: "苦瓜", open: "第4勺：苦瓜让锅边裂了一条线。", fog: "第4勺：锅边突然发苦", delta: -22, heat: 8, color: "#9bd36c" }
            ]
          },
          {
            target: "守住锅主最后一点体面",
            before: 36,
            records: [
              { name: "温水", open: "第1勺：温水让汤面安静了几秒。", fog: "第1勺：汤面短暂安静", delta: 10, heat: -6, color: "#a9dbff" },
              { name: "老火锅底", open: "第2勺：老火锅底把整锅推热。", fog: "第2勺：有人加了很重的东西", delta: -24, heat: 25, color: "#c85639" },
              { name: "豆皮", open: "第3勺：豆皮吸走了一点混乱。", fog: "第3勺：一片东西沉了下去", delta: 12, heat: -3, color: "#e8c67d" },
              { name: "酸笋", open: "第4勺：酸笋让锅盖开始发抖。", fog: "第4勺：空气突然酸了一下", delta: -25, heat: 13, color: "#d6d56b" }
            ]
          },
          {
            target: "别让这锅在最后翻车",
            before: 48,
            records: [
              { name: "萝卜", open: "第1勺：萝卜把汤底变清。", fog: "第1勺：白色方块浮起来", delta: 13, heat: -7, color: "#f3efe0" },
              { name: "花椒", open: "第2勺：花椒让锅开始发麻。", fog: "第2勺：锅里开始发麻", delta: -19, heat: 18, color: "#ac6f32" },
              { name: "热茶", open: "第3勺：热茶没有降温，但稳住了汤。", fog: "第3勺：有人倒了一杯热的", delta: 9, heat: 4, color: "#b68151" },
              { name: "爆辣包", open: "第4勺：爆辣包让锅只剩一口气。", fog: "第4勺：锅盖弹了一下", delta: -43, heat: 35, color: "#ff3e2b" }
            ]
          }
        ];

        const SPOONS = [
          { id: "save", name: "清汤勺", label: "救一把", delta: 28, heat: -12, color: "#8dd7c8", soup: "#bbdfc8" },
          { id: "heat", name: "爆辣勺", label: "添点热闹", delta: -36, heat: 30, color: "#ff553c", soup: "#ff6549" },
          { id: "blind", name: "盲盒勺", label: "赌一口", delta: 0, heat: 10, color: "#ffd05a", soup: "#eeb85a" }
        ];

        const BLIND = [
          { name: "冰糖", delta: 24, heat: -8, line: "盲盒里是冰糖，刚好把火气压住。" },
          { name: "老辣油", delta: -34, heat: 30, line: "盲盒里是老辣油，整锅直接上头。" },
          { name: "一勺空气", delta: 4, heat: 0, line: "盲盒里像是什么都没有，但锅松了口气。" },
          { name: "过期好运", delta: -18, heat: 18, line: "盲盒里是过期好运，味道有点不对。" }
        ];

        const state = {
          w: 390,
          h: 844,
          dpr: 1,
          phase: "choose",
          scenario: pick(PRESETS),
          spoon: null,
          blind: null,
          drag: null,
          finalIntegrity: 42,
          finalHeat: 55,
          replayStart: 0,
          revealIndex: -1,
          result: null,
          particles: [],
          steam: [],
          soupBits: [],
          shakeUntil: 0,
          lastTime: 0,
          pointerDown: false,
          stats: loadStats(),
          layout: {},
          message: "前面四勺已经下锅，现在只差你这一勺。"
        };

        function pick(list) {
          return list[Math.floor(Math.random() * list.length)];
        }

        function clamp(v, min, max) {
          return Math.max(min, Math.min(max, v));
        }

        function loadStats() {
          try {
            const raw = localStorage.getItem(STORE_KEY);
            return raw ? JSON.parse(raw) : { played: 0, saved: 0, lastRoles: {} };
          } catch (error) {
            return { played: 0, saved: 0, lastRoles: {} };
          }
        }

        function saveStats() {
          try {
            localStorage.setItem(STORE_KEY, JSON.stringify(state.stats));
          } catch (error) {
            return false;
          }
          return true;
        }

        function resize() {
          const width = Math.min(window.innerWidth, 460);
          const height = window.innerHeight || 844;
          state.dpr = Math.min(window.devicePixelRatio || 1, DPR_LIMIT);
          state.w = Math.round(width);
          state.h = Math.round(height);
          canvas.width = Math.round(width * state.dpr);
          canvas.height = Math.round(height * state.dpr);
          canvas.style.width = width + "px";
          canvas.style.height = height + "px";
          ctx.setTransform(state.dpr, 0, 0, state.dpr, 0, 0);
          computeLayout();
        }

        function computeLayout() {
          const w = state.w;
          const h = state.h;
          const potW = Math.min(w * 0.84, 340);
          const potH = Math.min(h * 0.22, 176);
          const potY = h * 0.39;
          state.layout = {
            titleY: Math.max(28, h * 0.044),
            target: { x: 18, y: Math.max(130, h * 0.16), w: w - 36, h: 72 },
            pot: { x: (w - potW) / 2, y: potY, w: potW, h: potH },
            lid: { x: (w - potW * 0.58) / 2, y: potY - potH * 0.2, w: potW * 0.58, h: potH * 0.23 },
            chef: { x: w * 0.72, y: potY + potH * 0.06, scale: Math.max(2.1, Math.min(3, w / 145)) },
            dockY: h - Math.max(150, h * 0.18),
            result: { x: 20, y: h * 0.08, w: w - 40, h: h * 0.78 }
          };
        }

        function p(v) {
          return Math.round(v);
        }

        function rect(x, y, w, h, color) {
          ctx.fillStyle = color;
          ctx.fillRect(p(x), p(y), p(w), p(h));
        }

        function text(value, x, y, size, color, align, weight) {
          ctx.fillStyle = color;
          ctx.textAlign = align || "left";
          ctx.textBaseline = "top";
          ctx.font = (weight || 900) + " " + size + "px PingFang SC, Microsoft YaHei, sans-serif";
          ctx.fillText(value, p(x), p(y));
        }

        function wrapText(value, x, y, maxWidth, size, lineHeight, color, align) {
          const chars = String(value).split("");
          let line = "";
          let yy = y;
          ctx.font = "900 " + size + "px PingFang SC, Microsoft YaHei, sans-serif";
          ctx.fillStyle = color;
          ctx.textAlign = align || "left";
          ctx.textBaseline = "top";
          for (let i = 0; i < chars.length; i += 1) {
            const test = line + chars[i];
            if (ctx.measureText(test).width > maxWidth && line) {
              ctx.fillText(line, p(x), p(yy));
              line = chars[i];
              yy += lineHeight;
            } else {
              line = test;
            }
          }
          if (line) ctx.fillText(line, p(x), p(yy));
          return yy + lineHeight;
        }

        function hit(point, box) {
          return point.x >= box.x && point.x <= box.x + box.w && point.y >= box.y && point.y <= box.y + box.h;
        }

        function pointerPoint(event) {
          const r = canvas.getBoundingClientRect();
          return {
            x: (event.clientX - r.left) * (state.w / r.width),
            y: (event.clientY - r.top) * (state.h / r.height)
          };
        }

        function spoonBoxes() {
          const gap = 10;
          const size = Math.min(96, (state.w - 44 - gap * 2) / 3);
          const startX = (state.w - size * 3 - gap * 2) / 2;
          return SPOONS.map(function (spoon, index) {
            return { item: spoon, x: startX + index * (size + gap), y: state.layout.dockY, w: size, h: size };
          });
        }

        function spawn(x, y, color, count, power) {
          for (let i = 0; i < count; i += 1) {
            state.particles.push({
              x: x,
              y: y,
              vx: (Math.random() - 0.5) * (power || 4),
              vy: -Math.random() * (power || 4) - 1,
              age: 0,
              life: 420 + Math.random() * 520,
              size: 3 + Math.random() * 7,
              color: color
            });
          }
        }

        function steamBurst(intense) {
          const pot = state.layout.pot;
          const count = intense ? 90 : 36;
          for (let i = 0; i < count; i += 1) {
            state.steam.push({
              x: pot.x + pot.w * (0.16 + Math.random() * 0.68),
              y: pot.y + pot.h * 0.08,
              vx: (Math.random() - 0.5) * (intense ? 2.6 : 1),
              vy: -1.4 - Math.random() * (intense ? 4.6 : 1.8),
              age: 0,
              life: 800 + Math.random() * 950,
              size: 8 + Math.random() * (intense ? 24 : 14),
              color: intense ? "#ffd3b3" : "#fff0d2"
            });
          }
        }

        function dropSpoon(spoon) {
          const blind = spoon.id === "blind" ? pick(BLIND) : null;
          const delta = spoon.id === "blind" ? blind.delta : spoon.delta;
          const heat = spoon.id === "blind" ? blind.heat : spoon.heat;
          state.spoon = spoon;
          state.blind = blind;
          state.finalIntegrity = clamp(state.scenario.before + delta, 0, 100);
          state.finalHeat = clamp(55 + heat, 0, 120);
          state.phase = "replay";
          state.replayStart = performance.now();
          state.revealIndex = -1;
          state.message = "锅史开始回放。";
          state.shakeUntil = performance.now() + 480;
          const pot = state.layout.pot;
          spawn(pot.x + pot.w / 2, pot.y + pot.h * 0.35, spoon.color, 70, 6);
          steamBurst(true);
        }

        function buildResult() {
          const survived = state.finalIntegrity > 0;
          let role = "";
          let title = "";
          let line = "";
          if (survived && state.spoon.id === "save") {
            role = "救场那一勺";
            title = "锅主的目标，被你稳住了";
            line = "你没有把场面变得更热闹，但你让它终于撑到最后。";
          } else if (!survived && state.spoon.id === "save") {
            role = "善意误判者";
            title = "你想救锅，但汤底已经太满";
            line = "有些局面不是不值得救，只是你来得太晚。";
          } else if (!survived && state.spoon.id === "heat") {
            role = "最后一勺";
            title = "这锅，停在了你的热闹里";
            line = "你只是添了一点火，没想到它刚好就是最后那一下。";
          } else if (survived && state.spoon.id === "heat") {
            role = "看戏赢家";
            title = "你添了乱，但锅居然撑住了";
            line = "有时候世界比你想象得更耐煮，热闹也能变成味道。";
          } else if (state.spoon.id === "blind") {
            role = survived ? "赌对的人" : "赌错的人";
            title = survived ? "盲盒救了这锅" : "盲盒把锅推过了线";
            line = state.blind ? state.blind.line : "你把结果交给了未知，锅给了你答案。";
          } else {
            role = survived ? "勉强守住的人" : "没守住的人";
            title = survived ? "这锅撑住了" : "这锅没撑住";
            line = "你的这一勺，被写进了这口锅的结局。";
          }
          const report = {
            role: role,
            title: title,
            line: line,
            survived: survived,
            verdict: survived ? "锅活过了第 5 勺" : "锅没撑过第 5 勺"
          };
          state.stats.played += 1;
          if (survived) state.stats.saved += 1;
          state.stats.lastRoles[role] = (state.stats.lastRoles[role] || 0) + 1;
          saveStats();
          return report;
        }

        function finishReplay() {
          state.result = buildResult();
          state.phase = "result";
          state.shakeUntil = performance.now() + 360;
          steamBurst(true);
          actions.classList.add("show");
        }

        function reset() {
          state.phase = "choose";
          state.scenario = pick(PRESETS);
          state.spoon = null;
          state.blind = null;
          state.drag = null;
          state.finalIntegrity = state.scenario.before;
          state.finalHeat = 55;
          state.replayStart = 0;
          state.revealIndex = -1;
          state.result = null;
          state.particles = [];
          state.steam = [];
          state.soupBits = [];
          state.message = "前面四勺已经下锅，现在只差你这一勺。";
          actions.classList.remove("show");
        }

        function copyReport() {
          const content = state.result
            ? "我在《一人一勺》里下了最后一勺，身份是「" + state.result.role + "」：" + state.result.line
            : "我在《一人一勺》里下了最后一勺。";
          if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(content).then(function () {
              shareBtn.textContent = "锅报已复制";
              setTimeout(function () { shareBtn.textContent = "复制这份锅报"; }, 1300);
            }).catch(function () {
              shareBtn.textContent = "长按截图分享";
              setTimeout(function () { shareBtn.textContent = "复制这份锅报"; }, 1300);
            });
          } else {
            shareBtn.textContent = "长按截图分享";
            setTimeout(function () { shareBtn.textContent = "复制这份锅报"; }, 1300);
          }
        }

        function update(dt, now) {
          const pot = state.layout.pot;
          if (state.phase === "choose" || state.phase === "replay") {
            const heat = state.phase === "replay" ? 1.8 : 1;
            if (Math.random() < 0.012 * dt * heat) {
              state.steam.push({
                x: pot.x + pot.w * (0.2 + Math.random() * 0.6),
                y: pot.y + pot.h * 0.1,
                vx: (Math.random() - 0.5) * 0.7,
                vy: -0.8 - Math.random() * 1.2,
                age: 0,
                life: 950 + Math.random() * 850,
                size: 8 + Math.random() * 16,
                color: "#fff0d2"
              });
            }
            if (Math.random() < 0.01 * dt * heat) {
              state.soupBits.push({
                x: pot.x + pot.w * (0.18 + Math.random() * 0.64),
                y: pot.y + pot.h * (0.38 + Math.random() * 0.2),
                age: 0,
                life: 820 + Math.random() * 640,
                size: 4 + Math.random() * 8,
                color: Math.random() > 0.5 ? "#ffd05a" : "#ff6749"
              });
            }
          }

          if (state.phase === "replay") {
            const elapsed = now - state.replayStart;
            const index = Math.min(4, Math.floor(elapsed / 950));
            if (index !== state.revealIndex) {
              state.revealIndex = index;
              state.shakeUntil = now + 220;
              const color = index < 4 ? state.scenario.records[index].color : state.spoon.color;
              spawn(pot.x + pot.w / 2, pot.y + pot.h * 0.42, color, 28, 4);
            }
            if (elapsed > 5400) finishReplay();
          }

          state.particles = state.particles.filter(function (item) {
            item.age += dt;
            item.x += item.vx * dt * 0.06;
            item.y += item.vy * dt * 0.06;
            item.vy += 0.012 * dt;
            return item.age < item.life;
          });
          state.steam = state.steam.filter(function (item) {
            item.age += dt;
            item.x += item.vx * dt * 0.08;
            item.y += item.vy * dt * 0.08;
            return item.age < item.life;
          });
          state.soupBits = state.soupBits.filter(function (item) {
            item.age += dt;
            item.y -= dt * 0.015;
            return item.age < item.life;
          });
        }

        function drawBackground(now) {
          const w = state.w;
          const h = state.h;
          ctx.fillStyle = "#1a0907";
          ctx.fillRect(0, 0, w, h);
          const g = ctx.createLinearGradient(0, 0, 0, h);
          g.addColorStop(0, "#3c140f");
          g.addColorStop(0.48, "#250b08");
          g.addColorStop(1, "#100403");
          ctx.fillStyle = g;
          ctx.fillRect(0, 0, w, h);
          for (let y = 0; y < h; y += 8) {
            for (let x = (y / 8) % 2 ? 4 : 0; x < w; x += 8) {
              rect(x, y, 2, 2, "rgba(255,255,255,0.018)");
            }
          }
          const glow = ctx.createRadialGradient(w / 2, h * 0.46, 30, w / 2, h * 0.46, w * 0.7);
          glow.addColorStop(0, "rgba(255,82,48,.28)");
          glow.addColorStop(1, "rgba(255,82,48,0)");
          ctx.fillStyle = glow;
          ctx.fillRect(0, 0, w, h);
        }

        function drawHeader() {
          const y = state.layout.titleY;
          text("前面四个人已经下手", state.w / 2, y, 13, "#ffd05a", "center", 900);
          text("一人一勺", state.w / 2, y + 22, Math.min(50, state.w * 0.14), "#fff0d2", "center", 900);
          text("最后一勺", state.w / 2, y + 78, 23, "#ff8a60", "center", 900);
        }

        function drawTarget() {
          if (state.phase === "result") return;
          const box = state.layout.target;
          rect(box.x, box.y, box.w, box.h, "rgba(36,13,9,.72)");
          rect(box.x + 5, box.y + 5, box.w - 10, box.h - 10, "rgba(255,240,210,.07)");
          text("锅主目标", box.x + 14, box.y + 12, 12, "#ffd05a", "left", 900);
          wrapText(state.scenario.target, box.x + 14, box.y + 34, box.w - 28, 18, 22, "#fff0d2", "left");
        }

        function soupColor() {
          if (state.phase === "result") return state.result && state.result.survived ? "#d98f5c" : "#6d2d23";
          if (state.phase === "replay" && state.spoon) return state.spoon.soup;
          return state.scenario.before < 40 ? "#d65a45" : "#df7d4d";
        }

        function drawPot(now) {
          const pot = state.layout.pot;
          const lid = state.layout.lid;
          const trouble = state.phase === "replay" ? 1 : 0;
          const wobble = (state.scenario.before < 40 || state.phase === "replay")
            ? Math.sin(now * 0.035) * (2.5 + trouble * 2.5)
            : Math.sin(now * 0.012) * 1.2;
          rect(pot.x - 28, pot.y + pot.h * 0.42, 40, 40, "#602815");
          rect(pot.x + pot.w - 12, pot.y + pot.h * 0.42, 40, 40, "#602815");
          rect(pot.x, pot.y + pot.h * 0.18, pot.w, pot.h * 0.62, "#9b4d2c");
          rect(pot.x + 10, pot.y + pot.h * 0.24, pot.w - 20, pot.h * 0.5, "#682d1d");
          rect(pot.x + 20, pot.y + pot.h * 0.3, pot.w - 40, pot.h * 0.34, soupColor());
          rect(pot.x + 24, pot.y + pot.h * 0.33, pot.w - 48, 9, "rgba(255,240,210,.34)");
          rect(pot.x + 18, pot.y + pot.h * 0.72, pot.w - 36, 20, "#3a160f");

          state.soupBits.forEach(function (item) {
            const alpha = 1 - item.age / item.life;
            ctx.globalAlpha = alpha;
            rect(item.x, item.y, item.size, item.size, item.color);
            ctx.globalAlpha = 1;
          });

          if (state.phase !== "result") {
            rect(lid.x, lid.y + wobble, lid.w, lid.h, "#8a4327");
            rect(lid.x + 8, lid.y + 5 + wobble, lid.w - 16, lid.h - 9, "#bd6a3a");
            rect(lid.x + lid.w * 0.42, lid.y - 11 + wobble, lid.w * 0.16, 13, "#5b2818");
          } else {
            rect(lid.x + lid.w * 0.7, lid.y - 38, lid.w * 0.62, lid.h, "#8a4327");
            rect(lid.x + lid.w * 0.76, lid.y - 33, lid.w * 0.48, lid.h - 9, "#bd6a3a");
          }

          drawGauge(pot.x + 26, pot.y + pot.h + 16, pot.w - 52, state.phase === "replay" || state.phase === "result" ? state.finalIntegrity : state.scenario.before);
        }

        function drawGauge(x, y, w, value) {
          rect(x, y, w, 12, "#35140e");
          rect(x, y, w * clamp(value, 0, 100) / 100, 12, value > 45 ? "#ffd05a" : value > 20 ? "#ff7b45" : "#ff4636");
          text("承受值 " + value, x + w / 2, y + 18, 12, "rgba(255,240,210,.78)", "center", 900);
        }

        function drawChef(now) {
          const c = state.layout.chef;
          const s = c.scale;
          const lean = state.phase === "replay" ? Math.sin(now * 0.04) * 5 : 0;
          const x = c.x + lean;
          const y = c.y + (state.phase === "result" ? -8 : 0);
          rect(x, y + 18 * s, 24 * s, 25 * s, "#f1c39b");
          rect(x + 4 * s, y + 11 * s, 16 * s, 10 * s, "#fff0d2");
          rect(x + 7 * s, y + 25 * s, 4 * s, 4 * s, "#2b100b");
          rect(x + 16 * s, y + 25 * s, 4 * s, 4 * s, "#2b100b");
          rect(x + 8 * s, y + 35 * s, 10 * s, 4 * s, state.phase === "replay" ? "#ff5a37" : "#7b3025");
          rect(x - 2 * s, y + 44 * s, 28 * s, 30 * s, "#7ac3ad");
          rect(x + 4 * s, y + 50 * s, 16 * s, 24 * s, "#fff0d2");
          rect(x - 11 * s, y + 48 * s, 11 * s, 8 * s, "#f1c39b");
          rect(x + 24 * s, y + (state.phase === "replay" ? 41 : 48) * s, 11 * s, 8 * s, "#f1c39b");
          rect(x + 3 * s, y + 74 * s, 8 * s, 12 * s, "#35140e");
          rect(x + 15 * s, y + 74 * s, 8 * s, 12 * s, "#35140e");
        }

        function drawRecordStrip() {
          if (state.phase === "result") return;
          const top = state.layout.pot.y - 102;
          const cardW = (state.w - 46) / 4;
          state.scenario.records.forEach(function (record, index) {
            const x = 17 + index * (cardW + 4);
            const active = state.phase === "replay" && state.revealIndex >= index;
            rect(x, top, cardW, 76, active ? "rgba(255,208,90,.2)" : "rgba(34,12,8,.72)");
            rect(x + 5, top + 5, cardW - 10, 66, active ? record.color : "rgba(255,240,210,.08)");
            text("第" + (index + 1) + "勺", x + cardW / 2, top + 10, 11, active ? "#2b100b" : "#ffd05a", "center", 900);
            wrapText(active ? record.name : "雾里", x + cardW / 2, top + 34, cardW - 12, 13, 16, active ? "#2b100b" : "rgba(255,240,210,.66)", "center");
          });
        }

        function drawReplayText() {
          if (state.phase !== "replay") return;
          const idx = state.revealIndex;
          let line = "";
          if (idx >= 0 && idx < 4) line = state.scenario.records[idx].open;
          if (idx >= 4) line = "第5勺：你放入了 " + (state.spoon ? state.spoon.name : "最后一勺") + "。";
          if (idx >= 4 && state.blind) line = "第5勺：" + state.blind.line;
          const y = state.layout.pot.y + state.layout.pot.h + 54;
          rect(22, y, state.w - 44, 64, "rgba(36,13,9,.78)");
          wrapText(line, state.w / 2, y + 15, state.w - 70, 17, 23, "#fff0d2", "center");
        }

        function drawSpoonIcon(spoon, x, y, size, active) {
          rect(x, y, size, size, active ? "#ffd05a" : "#3b160f");
          rect(x + 6, y + 6, size - 12, size - 12, "#230c08");
          rect(x + size * 0.45, y + 16, size * 0.12, size * 0.48, "#fff0d2");
          rect(x + size * 0.33, y + 10, size * 0.36, size * 0.2, spoon.color);
          rect(x + size * 0.39, y + 14, size * 0.22, size * 0.09, "rgba(255,255,255,.45)");
          text(spoon.label, x + size / 2, y + size + 8, 11, "#fff0d2", "center", 900);
          text(spoon.name, x + size / 2, y + size + 25, 10, "rgba(255,240,210,.62)", "center", 900);
        }

        function drawSpoonDock() {
          if (state.phase !== "choose") return;
          wrapText(state.message, state.w / 2, state.layout.dockY - 44, state.w - 48, 14, 19, "#ffd05a", "center");
          spoonBoxes().forEach(function (box) {
            drawSpoonIcon(box.item, box.x, box.y, box.w, state.drag && state.drag.item.id === box.item.id);
          });
        }

        function drawDragging() {
          if (!state.drag) return;
          drawSpoonIcon(state.drag.item, state.drag.x - 42, state.drag.y - 42, 84, true);
        }

        function drawParticles() {
          state.steam.forEach(function (item) {
            const alpha = 1 - item.age / item.life;
            ctx.globalAlpha = 0.22 * alpha;
            rect(item.x, item.y, item.size, item.size, item.color);
            ctx.globalAlpha = 1;
          });
          state.particles.forEach(function (item) {
            const alpha = 1 - item.age / item.life;
            ctx.globalAlpha = alpha;
            rect(item.x, item.y, item.size, item.size, item.color);
            ctx.globalAlpha = 1;
          });
        }

        function drawResult() {
          if (state.phase !== "result" || !state.result) return;
          const r = state.layout.result;
          rect(r.x, r.y, r.w, r.h, "rgba(35,12,8,.94)");
          rect(r.x + 6, r.y + 6, r.w - 12, r.h - 12, "rgba(255,240,210,.07)");
          text("第5勺锅报", state.w / 2, r.y + 24, 14, "#ffd05a", "center", 900);
          wrapText(state.result.role, state.w / 2, r.y + 54, r.w - 44, 36, 42, "#fff0d2", "center");
          text(state.result.verdict, state.w / 2, r.y + 126, 16, state.result.survived ? "#ffd05a" : "#ff7b58", "center", 900);
          drawResultPot(state.w / 2 - 58, r.y + 164, 116, state.result.survived);
          wrapText(state.result.title, state.w / 2, r.y + 300, r.w - 52, 22, 30, "#fff0d2", "center");
          wrapText(state.result.line, r.x + 30, r.y + 372, r.w - 60, 17, 27, "rgba(255,240,210,.84)", "left");
          const spoonName = state.spoon ? state.spoon.name : "最后一勺";
          text("你下的是：" + spoonName, state.w / 2, r.y + r.h - 112, 14, "#ffd05a", "center", 900);
          text("已下过 " + state.stats.played + " 次 · 守住 " + state.stats.saved + " 次", state.w / 2, r.y + r.h - 82, 12, "rgba(255,240,210,.62)", "center", 900);
        }

        function drawResultPot(x, y, size, survived) {
          rect(x, y + size * 0.25, size, size * 0.48, "#9b4d2c");
          rect(x + 10, y + size * 0.32, size - 20, size * 0.25, survived ? "#db8a55" : "#6d2d23");
          rect(x + 14, y + size * 0.35, size - 28, 7, "rgba(255,240,210,.36)");
          if (survived) {
            rect(x + size * 0.28, y + size * 0.11, size * 0.44, size * 0.16, "#bd6a3a");
            rect(x + size * 0.42, y + size * 0.01, size * 0.16, size * 0.12, "#5b2818");
          } else {
            rect(x + 20, y + size * 0.17, 12, 12, "#ff5a37");
            rect(x + size - 36, y + size * 0.2, 16, 14, "#ff5a37");
            rect(x + size * 0.46, y + size * 0.06, 8, 24, "#ff5a37");
          }
        }

        function draw(now) {
          const shake = now < state.shakeUntil ? Math.sin(now * 0.08) * 4 : 0;
          ctx.save();
          ctx.translate(shake, 0);
          drawBackground(now);
          if (state.phase === "result") {
            drawParticles();
            drawResult();
            ctx.restore();
            return;
          }
          drawHeader();
          drawTarget();
          drawRecordStrip();
          drawPot(now);
          drawChef(now);
          drawParticles();
          drawReplayText();
          drawSpoonDock();
          drawDragging();
          ctx.restore();
        }

        function loop(now) {
          const dt = Math.min(42, now - (state.lastTime || now));
          state.lastTime = now;
          update(dt, now);
          draw(now);
          requestAnimationFrame(loop);
        }

        function onPointerDown(event) {
          const point = pointerPoint(event);
          state.pointerDown = true;
          try { canvas.setPointerCapture(event.pointerId); } catch (error) { return null; }
          if (state.phase === "choose") {
            const box = spoonBoxes().find(function (item) { return hit(point, item); });
            if (box) {
              state.drag = { item: box.item, x: point.x, y: point.y };
              state.message = "拖到锅中央，放下最后一勺。";
              spawn(point.x, point.y, box.item.color, 8, 3);
            }
          }
        }

        function onPointerMove(event) {
          const point = pointerPoint(event);
          if (state.drag) {
            state.drag.x = point.x;
            state.drag.y = point.y;
            if (Math.random() < 0.28) spawn(point.x, point.y, state.drag.item.color, 1, 2);
          }
        }

        function onPointerUp(event) {
          const point = pointerPoint(event);
          state.pointerDown = false;
          if (state.drag) {
            const item = state.drag.item;
            const pot = state.layout.pot;
            const zone = { x: pot.x - 16, y: pot.y - 42, w: pot.w + 32, h: pot.h * 1.06 };
            state.drag = null;
            if (hit(point, zone)) {
              dropSpoon(item);
            } else {
              state.message = "还没下进去，再拖到锅中央。";
            }
          }
          try { canvas.releasePointerCapture(event.pointerId); } catch (error) { return null; }
        }

        function onCancel() {
          state.pointerDown = false;
          state.drag = null;
        }

        window.addEventListener("resize", resize);
        window.addEventListener("orientationchange", resize);
        window.addEventListener("error", function () { fallback.style.display = "grid"; });
        window.addEventListener("unhandledrejection", function () { fallback.style.display = "grid"; });
        canvas.addEventListener("pointerdown", onPointerDown);
        canvas.addEventListener("pointermove", onPointerMove);
        canvas.addEventListener("pointerup", onPointerUp);
        canvas.addEventListener("pointercancel", onCancel);
        shareBtn.addEventListener("click", copyReport);
        againBtn.addEventListener("click", reset);

        resize();
        requestAnimationFrame(loop);
      } catch (error) {
        const fallback = document.getElementById("fallback");
        if (fallback) fallback.style.display = "grid";
      }
    })();
  </script>
</body>
</html>
